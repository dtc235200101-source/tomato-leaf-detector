services:
  - type: web
    name: tomato-leaf-detector
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: TDET_DEVICE
        value: cpu
      - key: TDET_MAX_LOADED_MODELS
        value: "1"
      - key: TDET_LOG_LEVEL
        value: INFO
